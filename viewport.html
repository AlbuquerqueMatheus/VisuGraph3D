<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visor da cena</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15171c;
      }
      #vg-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      /* canvas criado pelo código do aluno (um WebGLRenderer a mais) não cobre o visor */
      body > canvas:not(#vg-canvas) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="vg-canvas" tabindex="0" aria-label="Cena 3D"></canvas>
    <script type="module" src="./src/live/runtime/viewport.js"></script>
  </body>
</html>
